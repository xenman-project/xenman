# Builds a release from a tag: the Docker image, the appliance (.xva) and the
# signed update package (.xenup), and publishes them as a GitHub release.
#
#   git tag -a v1.2.3 -m "XenMan 1.2.3" && git push origin v1.2.3
#
# The release's text is the version's section of CHANGELOG.md (a release
# candidate, v1.2.3-rc.1, takes 1.2.3's): write it first -- without it the
# release is not published (.github/release-notes.sh).
#
# Only the update package needs the private signing key. Its job runs in the
# "release" environment, which holds the key as a secret, accepts only v* tags
# and waits for a maintainer's approval before it starts.
#
# "Run workflow" by hand is a dry run: everything is built, nothing is pushed
# or published; the files stay with the run as artifacts for three days.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  # Appended to the title of every release while XenMan is in beta -- not to
  # a release candidate (a tag with "-", e.g. v1.2.3-rc.1); empty it to drop.
  TITLE_SUFFIX: " (Beta)"

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name != 'push' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.ref_name }}

  xenup:
    name: Update package (.xenup)
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and sign
        env:
          RELEASE_KEY_PEM: ${{ secrets.RELEASE_KEY }}
        run: |
          key="$RUNNER_TEMP/release-key"
          ( umask 077; printf '%s\n' "$RELEASE_KEY_PEM" > "$key" )
          trap 'rm -f "$key"' EXIT
          RELEASE_KEY="$key" ./appliance/build-update.sh
      - name: Verify against the public key in the repository
        run: |
          f=$(ls dist/*.xenup)
          node appliance/xenup.js verify --file "$f" --key appliance/release-key.pub > /dev/null
          echo "signature valid: $(basename "$f")"
          (cd dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: xenup
          path: dist/*.xenup*
          retention-days: 3

  xva:
    name: Appliance (.xva)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap fdisk util-linux e2fsprogs curl tar xz-utils grub2-common grub-pc-bin git
          sudo git config --system --add safe.directory '*'
      - name: Build
        run: sudo RELEASE_KEY_PUB="$PWD/appliance/release-key.pub" TMPDIR=/mnt ./appliance/build-appliance.sh
      - name: Checksum
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          f=$(ls dist/*.xva)
          (cd dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256")
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: xva
          path: dist/*.xva*
          retention-days: 3
          compression-level: 0

  # Runs on a dry run too, up to the notes, so publishing is tested before a tag needs it.
  release:
    name: Publish release
    needs: [docker, xenup, xva]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          # The version the builds named their files after: the tag, or the commit on a dry run.
          xva=$(ls dist/xenman-appliance-*.xva); name=${xva#dist/xenman-appliance-}; name=${name%.xva}
          for f in "xenman-appliance-$name.xva" "xenman-appliance-$name.xva.sha256" "xenman-$name.xenup" "xenman-$name.xenup.sha256"; do
            [ -s "dist/$f" ] || { echo "missing: $f"; exit 1; }
          done
          (cd dist && sha256sum -c "xenman-appliance-$name.xva.sha256" "xenman-$name.xenup.sha256")
          xva_sha=$(cut -d' ' -f1 "dist/xenman-appliance-$name.xva.sha256")
          xenup_sha=$(cut -d' ' -f1 "dist/xenman-$name.xenup.sha256")
          # The version's section of CHANGELOG.md, then the files: no section, no release.
          bash .github/release-notes.sh "$name" "$xva_sha" "$xenup_sha" "$GITHUB_REPOSITORY" "${TITLE_SUFFIX:+beta}" > "$RUNNER_TEMP/notes.md"
          echo "NAME=$name" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$NAME" = "$TAG" ] || { echo "files are named $NAME, the tag is $TAG"; exit 1; }
          prerelease=""; suffix="$TITLE_SUFFIX"
          case "$TAG" in *-*) prerelease="--prerelease"; suffix="";; esac
          gh release create "$TAG" --verify-tag --title "XenMan ${TAG#v}${suffix}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $prerelease \
            dist/xenman-appliance-"$TAG".xva dist/xenman-appliance-"$TAG".xva.sha256 \
            dist/xenman-"$TAG".xenup dist/xenman-"$TAG".xenup.sha256
