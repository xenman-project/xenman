# Type check, lint and the test suites (tests/run-suites.sh, the list in
# tests/ci-suites.txt) on the Node.js the appliance ships
# (appliance/node-version). The suites run XenMan against a fake pool
# (tests/fake-xapi.js), split over four runners.
#
# Also called by node-watch.yml with a branch to test.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: node
        run: . appliance/node-version && echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  suites:
    name: Suites ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: node
        run: . appliance/node-version && echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Suites
        run: tests/run-suites.sh
        env:
          SHARD: ${{ matrix.shard }}/4
          LOGS: ${{ runner.temp }}/suites
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suite-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/suites
          retention-days: 7
