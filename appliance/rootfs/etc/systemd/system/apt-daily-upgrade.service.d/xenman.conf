# Managed by XenMan: replaced by appliance updates.
#
# apt-daily-upgrade.service normally runs apt's own install step. Replacing it
# with xenman-os-update leaves one path by which the operating system changes,
# and that path writes to XenMan's audit log. apt-daily.service, which fetches
# the package lists and downloads, is left as it is.
#
# --scheduled makes the run ask xenman-os-policy first: it installs only inside
# the maintenance window, and never in manual mode. When the timer fires is set
# by the drop-in xenman-os-policy writes for apt-daily-upgrade.timer.

[Service]
ExecStart=
ExecStart=/usr/local/sbin/xenman-os-update --scheduled
