# Managed by XenMan: replaced by appliance updates.
#
# agetty prints /etc/issue, and the address in it, once: when the login prompt
# first appears. On a boot where the prompt beats DHCP, the console shows
# "https:///" and never corrects itself, because agetty does not watch for an
# address that arrives later. Without guest tools XenCenter shows no address
# either, which leaves the console as the only place to learn it.
#
# This unit finishes exactly when the network is configured, so the prompts
# are redrawn here. The "-" keeps a failed redraw from failing
# network-online.target, which XenMan waits for.

[Service]
ExecStartPost=-/usr/sbin/agetty --reload
